name: Atualizar Ordem Maior

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-major-order
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consultar a Ordem Maior
        run: python3 .github/scripts/update_major_order.py

      - name: Salvar alteracoes no repositorio
        shell: bash
        run: |
          if git diff --quiet -- dados/major-order.json; then
            echo "Nenhuma mudanca na Ordem Maior."
            exit 0
          fi

          git config user.name "Super Earth Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/major-order.json
          git commit -m "chore: atualizar estado da Ordem Maior"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
